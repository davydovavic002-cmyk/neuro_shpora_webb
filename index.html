<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>НейроШпора - Кабинет</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; padding: 20px; }
        .card { background: #1a1a1a; padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #333; }
        .btn { background: #0088cc; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; width: 100%; cursor: pointer; }
        h1 { color: #0088cc; font-size: 24px; }
    </style>
</head>
<body>
    <h1>🚀 Твой прогресс</h1>
    <div class="card">
        <p>Предмет: <span id="subject">Не выбран</span></p>
        <div style="background: #333; height: 10px; border-radius: 5px;">
            <div style="background: #0088cc; width: 45%; height: 100%; border-radius: 5px;"></div>
        </div>
        <p>Готовность: 45%</p>
    </div>

    <button class="btn" onclick="sendDataToBot()">Получить новый план</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть на весь экран

        // Получаем данные о пользователе
        document.getElementById('subject').innerText = tg.initDataUnsafe.user.first_name || "Ученик";

        function sendDataToBot() {
            // Отправляем данные обратно боту
            tg.sendData(JSON.stringify({action: "new_plan"}));
            tg.close();
        }
    </script>
</body>
</html>
